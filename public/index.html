<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LCT AI Assistant (Whisper Powered)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>LCT Whisper AI Assistant</h1>
    <p>Peka jarak jauh & akurat setara ChatGPT</p>
    
    <div class="status-box">
      <p>Status: <span id="status-text">Ready</span></p>
      <button id="btn-record">🎙️ Klik untuk Rekam</button>
    </div>

    <div class="result-box">
      <h3>Hasil Dengar Whisper AI:</h3>
      <p id="transcript-text">- Belum ada suara -</p>
    </div>

    <div class="ai-box">
      <h3>Jawaban AI (Di OLED):</h3>
      <p id="ai-response">- Waiting -</p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
