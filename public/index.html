<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP8266 AI Controller</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2>🤖 AI to ESP8266 OLED</h2>
    
    <div id="chat-box" class="chat-box">
      <p class="bot-msg">Halo! Ketik pertanyaanmu, jawabannya akan dikirim ke layar OLED ESP8266.</p>
    </div>

    <form id="ai-form">
      <input type="text" id="user-input" placeholder="Tulis pertanyaan..." required autocomplete="off">
      <button type="submit" id="send-btn">Kirim</button>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
